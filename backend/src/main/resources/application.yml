spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/clubdocs
    username: clubdocs
    password: clubdocs
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    repair-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 384
        distance-type: COSINE_DISTANCE
        index-type: HNSW

clubdocs:
  storage:
    dir: ./data/uploads
