spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/clubdocs
    username: clubdocs
    password: clubdocs
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    repair-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    model:
      embedding: transformers # keep the local ONNX embeddings; the Ollama starter could add a second embedding model
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        model: qwen3.5:4b
        num-ctx: 4096
        temperature: 0.1 # low = fewer hallucinated details
        options:
          think-option: FALSE # Qwen3 auto-enables thinking; disable for faster RAG answers
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 384
        distance-type: COSINE_DISTANCE
        index-type: HNSW

clubdocs:
  storage:
    dir: ./data/uploads
