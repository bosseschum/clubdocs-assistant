<article [class]="'message ' + message().role">
  <p class="text">{{ formattedText() }}</p>

  @if (message().sources.length > 0) {
    <details>
      <summary>Quellen ({{ message().sources.length }}, zitiert: {{ cited().length }})</summary>
      <ol>
        @for (source of message().sources; track $index) {
          <li [class.cited]="cited().includes($index + 1)">
            [{{ $index + 1 }}] {{ source.filename }}, Seite {{ source.page }}
            <blockquote>{{ source.text }}</blockquote>
          </li>
        }
      </ol>
    </details>
  }
</article>
