<div class="chat-page-container">
  <header class="chat-header">
    <h2>Dokumenten-Research Chat</h2>
    <p class="chat-subtitle">Stelle Fragen zu deinen hochgeladenen Dokumenten.</p>
  </header>

  <div class="messages-container">
    @for (message of messages(); track message.id) {
      <app-chat-message [message]="message" />
    }

    @if (pending()) {
      <div role="status" class="pending-indicator">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
        <span class="pending-text">Antwort wird erstellt … das kann bis zu 30 Sekunden dauern.</span>
      </div>
    }
  </div>

  <footer class="chat-footer">
    <app-chat-input #input [disabled]="pending()" (questionSubmitted)="onQuestionSubmitted($event)" />
  </footer>
</div>
